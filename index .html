<!DOCTYPE html><html lang="vi"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Brotato</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #canvas:focus {
      outline: none;
    }

    /* Loading status overlay */
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    #status.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #statusText {
      font-size: 16px;
    }

    .loader-bar {
      width: 320px;
      max-width: 80vw;
      height: 10px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
    }

    #loaderFill {
      height: 100%;
      width: 8%;
      background: #4caf50;
      transition: width 0.2s ease;
    }

    #loaderPercent {
      font-size: 13px;
      color: #aaa;
    }

  </style>
</head>
<body>

  <canvas id="canvas" tabindex="0"></canvas>

  <div id="status">
    <div id="statusText">Loading...</div>
    <div class="loader-bar">
      <div id="loaderFill"></div>
    </div>
    <div id="loaderPercent">8%</div>
  </div>

  <script src="js/protect.js"></script>
  <script src="js/loader.js"></script>


</body></html>
